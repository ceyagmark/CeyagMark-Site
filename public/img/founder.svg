<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Portrait of Shashika Tharinda, founder of CeyagMark">
  <defs>
    <radialGradient id="cmBg" cx="50%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#16306b"/>
      <stop offset="48%" stop-color="#0c1f4d"/>
      <stop offset="100%" stop-color="#070f28"/>
    </radialGradient>
    <linearGradient id="cmFig" x1="32%" y1="8%" x2="74%" y2="100%">
      <stop offset="0%" stop-color="#5aa0ff"/>
      <stop offset="46%" stop-color="#2e86ff"/>
      <stop offset="100%" stop-color="#1a4fb0"/>
    </linearGradient>
    <linearGradient id="cmRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bcd8ff"/>
      <stop offset="55%" stop-color="#7db0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cmGlow" cx="50%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#3f8bff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#3f8bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cmClip"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>

  <g clip-path="url(#cmClip)">
    <rect width="200" height="200" fill="url(#cmBg)"/>
    <rect width="200" height="200" fill="url(#cmGlow)"/>

    <!-- orbit motif echoing the brand mark -->
    <circle cx="100" cy="92" r="78" fill="none" stroke="#2e86ff" stroke-opacity=".16" stroke-width="1"/>
    <circle cx="100" cy="92" r="60" fill="none" stroke="#2e86ff" stroke-opacity=".12" stroke-width="1"/>
    <circle cx="161" cy="56" r="3.2" fill="#7db0ff" opacity=".85"/>

    <!-- shoulders -->
    <path d="M28 200 C30 158 58 132 100 132 C142 132 170 158 172 200 Z" fill="url(#cmFig)"/>
    <path d="M28 200 C30 158 58 132 100 132 C142 132 170 158 172 200 Z" fill="url(#cmRim)" opacity=".5"/>
    <!-- collar accent -->
    <path d="M100 132 C84 132 70 138 60 149 C74 150 84 158 100 158 C116 158 126 150 140 149 C130 138 116 132 100 132 Z" fill="#0b1c45" opacity=".55"/>

    <!-- head -->
    <circle cx="100" cy="86" r="34" fill="url(#cmFig)"/>
    <path d="M100 52 a34 34 0 0 1 24 58 a34 34 0 0 0 -24 -58 Z" fill="url(#cmRim)" opacity=".6"/>
    <!-- subtle neck shadow -->
    <path d="M86 116 q14 12 28 0 v10 q-14 10 -28 0 Z" fill="#0b1c45" opacity=".35"/>
  </g>

  <!-- frame ring -->
  <circle cx="100" cy="100" r="98.5" fill="none" stroke="#2e86ff" stroke-opacity=".55" stroke-width="3"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
</svg>
