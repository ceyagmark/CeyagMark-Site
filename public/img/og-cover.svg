<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091633"/>
      <stop offset="46%" stop-color="#05091a"/>
      <stop offset="100%" stop-color="#04070f"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#2e86ff" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#2e86ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e86ff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#2e86ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5aa0ff"/>
      <stop offset="100%" stop-color="#1a56c4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- sparkline motif bottom -->
  <path d="M0,500 L120,486 L240,492 L360,452 L480,462 L600,408 L720,418 L840,356 L960,372 L1080,300 L1200,272 L1200,630 L0,630 Z" fill="url(#spark)" opacity=".7"/>
  <path d="M0,500 L120,486 L240,492 L360,452 L480,462 L600,408 L720,418 L840,356 L960,372 L1080,300 L1200,272" fill="none" stroke="#5aa0ff" stroke-width="3"/>

  <!-- logo mark -->
  <g transform="translate(96,92)">
    <rect x="0" y="0" width="58" height="58" rx="16" fill="url(#mark)"/>
    <path d="M40 19 a16 16 0 1 0 4 14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M41 12 l5 8 l-9 1 z" fill="#ffffff"/>
  </g>
  <text x="170" y="132" font-family="Space Grotesk, Arial, sans-serif" font-size="34" font-weight="700" fill="#eef3fc">Ceyag<tspan fill="#5aa0ff">mark</tspan></text>

  <!-- eyebrow -->
  <text x="98" y="246" font-family="Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="5" fill="#6aa6ff">PERFORMANCE MARKETING POWERED BY AI</text>

  <!-- headline -->
  <text x="94" y="330" font-family="Space Grotesk, Arial, sans-serif" font-size="74" font-weight="700" fill="#ffffff">We don't sell marketing.</text>
  <text x="94" y="416" font-family="Space Grotesk, Arial, sans-serif" font-size="74" font-weight="700" fill="#5aa0ff">We sell growth you can bank.</text>

  <!-- subline -->
  <text x="98" y="476" font-family="Arial, sans-serif" font-size="26" fill="#b3c0db">Revenue, lifetime value and conversion rate up. Cost per acquisition down.</text>
</svg>
